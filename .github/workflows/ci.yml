# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  image:
    name: Reproducible OCI image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact source twice
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          base='node:24.19.0-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584'

          for attempt in one two; do
            docker buildx build \
              --build-arg "NODE_RUNTIME_IMAGE=$base" \
              --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
              --metadata-file "/tmp/$attempt.json" \
              --no-cache \
              --output "type=oci,dest=/tmp/$attempt.tar,rewrite-timestamp=true" \
              --platform linux/amd64 \
              --pull \
              .
          done

          one="$(jq -er '."containerimage.digest"' /tmp/one.json)"
          two="$(jq -er '."containerimage.digest"' /tmp/two.json)"
          test "$one" = "$two"

          docker buildx build \
            --build-arg "NODE_RUNTIME_IMAGE=$base" \
            --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
            --load \
            --platform linux/amd64 \
            --pull \
            --tag lazurio-github-app-license-check:ci \
            .
          test "$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
            lazurio-github-app-license-check:ci)" = "Apache-2.0"
          docker run --rm --entrypoint sh lazurio-github-app-license-check:ci -eu -c '
            test "$(sha256sum /usr/share/licenses/lazurio-github-app/LICENSE | cut -d" " -f1)" = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
            test "$(sha256sum /usr/share/licenses/lazurio-github-app/third-party/github-cli/LICENSE | cut -d" " -f1)" = "6da4adc42392c8485e40b4251c7e332fc3352df1947c9ffade71dd60b14a7a4f"
            test -s /usr/share/licenses/lazurio-github-app/THIRD_PARTY_NOTICES.md
          '
